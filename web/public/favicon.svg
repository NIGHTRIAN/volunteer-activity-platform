<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    站点图标。
    
    形状与页头的品牌图标**一致**（同一段 path），这样标签页上的
    图标和页面内的标识是同一个东西 —— 两处各画一个不同形状的图形，
    会让人以为是两个站点。
    
    用 SVG 而不是 .ico/.png：
      * 一个文件搞定所有尺寸（16/32/180 都由浏览器缩放）；
      * 纯文本，压缩后几百字节；
      * 方案 §8.4 把带宽列为瓶颈，因此图标也得算进预算。
    
    颜色写死而不是用 CSS 变量 —— 图标是独立文档，拿不到页面的变量。
    值与 tokens.css 的 --c-primary 一致。
  -->
  <rect width="24" height="24" rx="5" fill="#1a6ae0"/>
  <path
    d="M12 19.2s-6.3-3.9-6.3-8.1a3.6 3.6 0 0 1 6.3-2.4 3.6 3.6 0 0 1 6.3 2.4c0 4.2-6.3 8.1-6.3 8.1Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
