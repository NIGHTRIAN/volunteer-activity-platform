org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ══ Kotlin 编译配置（本机实测必需的绕行）══════════════════════════════════
#
# ## 问题现象
#
# 首次构建时 `:device_info_plus:compileDebugKotlin` 等任务失败：
#
#   e: Daemon compilation failed
#   Caused by: java.lang.AssertionError:
#     Could not close incremental caches in .../caches-jvm/jvm/kotlin:
#     class-fq-name-to-source.tab, source-to-classes.tab, internal-name-to-source.tab
#
# 这是 Kotlin **增量编译缓存**在 Windows 上被占用 / 无法关闭导致的，
# 与我们自己的代码无关（失败的三个都是 pub.dev 上的第三方插件）。
# 常见诱因：杀毒软件实时扫描、索引服务，或遗留的 Kotlin daemon
# 仍持有那些 `.tab` 文件的句柄。
#
# ## 为什么这样绕
#
# * `kotlin.compiler.execution.strategy=in-process`
#   让 Kotlin 编译在 Gradle daemon 进程内进行，不再另起一个 daemon。
#   少一个进程就少一处文件句柄竞争。代价是失去跨构建的 daemon 复用，
#   编译略慢——对首次构建影响很小。
#
# * `kotlin.incremental=false`
#   直接关掉增量编译缓存。**这是有损的取舍**：改 Kotlin 代码需要全量编译
#   该模块。但本项目几乎不改原生代码（只有插件与 Flutter 生成的胶水层），
#   而增量缓存导致的失败会直接阻断构建——两害相权取其轻。
#
# 若将来原生代码变多、编译时间成为瓶颈，可以先把 `kotlin.incremental`
# 改回 `true` 试试（缓存占用问题可能已随环境变化消失）。
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

# AndroidX 已全面使用，无需 Jetifier 转换（转换本身会拖慢构建）。
android.enableJetifier=false
