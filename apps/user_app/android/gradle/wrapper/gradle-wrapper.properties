distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# ⚠️ 使用国内镜像，且用 -bin 而不是 -all。
#
# 官方 services.gradle.org 在本机实测**不可达**（HEAD 请求超时，下载停滞在 0 MB），
# 而 `-all` 包含源码与文档（224 MB）—— 构建完全用不到。
# 换成腾讯云镜像的 `-bin`（130 MB），既可达又快。
#
# 版本号必须与 Flutter 生成的默认值一致（9.3.1）：
# AGP 9.1.0 / Kotlin 2.4.0 对 Gradle 版本有下限要求。
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip
