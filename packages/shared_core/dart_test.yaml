# dart test 配置。
#
# ## 为什么需要它
#
# `dart test` 默认**按文件并行**执行。对本仓库来说这是错的：
#
# 端到端测试（`test/e2e_*_test.dart`）打的是**同一个 Mock 服务端进程**，
# 而该进程用**单个 JSON 文件**持久化，写入是「读-改-写」。
# 多个测试文件并发写同一个文件会互相覆盖 —— 表现为若干条断言
# 偶发失败（实测：串行 154 项全绿，并行 151 通过 / 3 失败）。
#
# 这类 flaky 特别有害：它看起来像业务 bug，会让人去查根本不存在的逻辑错误。
#
# ## 处置
#
# `concurrency: 1` 让全部测试串行。全量跑一遍只要约 2 秒，
# 完全不需要为并行省下的那点时间冒 flaky 的风险。
#
# 纯单测（`activity_test` / `api_client_test` / `offline_queue_test` /
# `time_and_geo_test`）彼此独立、也不碰服务端，串行对它们没有损失。
concurrency: 1

# 端到端测试需要 Mock 在跑。未启动时它们会自行跳过（不报失败），
# 因此这里不打 tag 排除 —— 默认行为应当是"能跑就跑"。
