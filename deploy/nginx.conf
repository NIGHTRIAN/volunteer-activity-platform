# Nginx 反向代理配置（生产）。
#
# 方案 §3 / §8.2 的要求：
#   * 反向代理：HTTPS 终止、静态资源、限流
#   * **前后端同域**，规避 CORS
#   * 443 对外，8080 仅内网
#
# ## 为什么"同域"很重要
#
# 前端的 API 客户端写的是 `/api`（相对路径），不带任何主机名。
# 于是浏览器认为是同源请求，**完全不涉及 CORS** ——
# 这比"配一堆 Allow-Origin 头"安全得多，也不会因为某个来源
# 忘了加而被浏览器拦掉。
#
# 对应地，服务端的 CORS_ORIGIN 可以保持很严（生产建议指定具体域名，
# 而不是 `*`）。
#
# ## ⚠️ 本文件未在本机验证
#
# 本机没有 Docker 也没有 Nginx，因此这份配置只做了静态检查。
# 首次部署时请按 docs/web-server.md 的步骤逐条验证。

# 限流区。
#
# 方案 §3 要求 Nginx 承担限流。这里按 IP 限制请求速率，
# 用于挡住爬虫与暴力尝试；应用层还有自己的账号锁定策略
# （连续 5 次失败锁 10 分钟），两层互补。
limit_req_zone $binary_remote_addr zone=vol_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=vol_export:10m rate=2r/s;

# 上游：同步服务。容器网络内用服务名解析。
upstream volunteer_server {
    server server:8080;
    keepalive 16;
}

# ── HTTP：跳转到 HTTPS，并保留 ACME 校验路径 ────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt 的 HTTP-01 校验必须能在 80 端口明文访问。
    # 放在跳转之前，否则证书续期会失败。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ───────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # 证书。方案 §8.3：Let's Encrypt（certbot）或学校/云厂商证书。
    # ⚠️ 路径按实际部署调整；这两个文件必须存在，否则 Nginx 起不来。
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 现代 TLS 配置：只留 TLS 1.2/1.3，禁用已知弱套件。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS。
    # ⚠️ 先不要加 `includeSubDomains` 与 `preload` —— 一旦生效很难回退。
    # 确认全站 HTTPS 稳定运行一段时间后再考虑。
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 基础安全头。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 前端产物大小（方案 §8.4：首屏静态资源约 400KB）。
    # 开 gzip 后实测首屏约 106KB（gzip），远低于预算。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # ── 前端静态资源 ──────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # 带内容哈希的产物可以长期缓存（Vite 生成的文件名含 hash）。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html **不能**缓存：否则发布新版本后用户还是拿到旧的、
    # 指向已删除的资源，页面白屏。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── API ───────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=vol_api burst=60 nodelay;

        proxy_pass http://volunteer_server;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 服务端用 X-Forwarded-For 记录客户端 IP（审计与限流用）。
        # ⚠️ 注意：该头可伪造，因此服务端**不**把它当安全边界，
        #    仅用于日志。真正的鉴权靠令牌。
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 超时：略大于应用层超时，让应用先自己返回错误，
        # 而不是被 Nginx 掐断（那样客户端拿到的是 504 而不是业务错误）。
        proxy_connect_timeout 5s;
        proxy_send_timeout   30s;
        proxy_read_timeout   30s;

        # 名单导入可能较大（方案 §8.1 提到 8MB 上限）。
        client_max_body_size 10m;
        proxy_request_buffering on;
    }

    # 导出接口单独限流：导出会全表扫描并生成文件，
    # 比普通查询贵得多，不该允许被频繁调用。
    location /api/activities/export {
        limit_req zone=vol_export burst=5 nodelay;
        proxy_pass http://volunteer_server;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ── 前端路由 ──────────────────────────────────────────────────
    #
    # 本项目用 **hash 模式**（`/#/activity/1001`），因此所有前端路由
    # 都落在 `/` 上，不需要服务端重写规则。
    #
    # 这是刻意选的：history 模式下必须配 `try_files ... /index.html`，
    # 漏配的表现是"刷新详情页 404"，而那种问题很容易被当成后端故障。
    # hash 模式没有这个风险。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
